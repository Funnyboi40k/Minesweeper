<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minesweeper+</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="titleRow">
        <h1>Minesweeper+</h1>
        <div id="status" class="status">Ready</div>
      </div>

      <div class="controls">
        <label class="ctl">
          Difficulty
          <select id="difficulty">
            <option value="beginner">Beginner (9×9, 10)</option>
            <option value="intermediate">Intermediate (16×16, 40)</option>
            <option value="expert">Expert (30×16, 99)</option>
          </select>
        </label>

        <label class="ctl">
          Theme
          <select id="theme">
            <option value="neo">Neo (default)</option>
            <option value="classic" disabled>Classic (Locked)</option>
            <option value="pastel" disabled>Pastel (Locked)</option>
            <option value="amoled" disabled>AMOLED (Locked)</option>
          </select>
        </label>

        <label class="ctl">
          Bomb skin
          <select id="bombSkin">
            <option value="bomb">💣 Bomb (default)</option>
            <option value="skull" disabled>💀 Skull Bomb (Locked)</option>
            <option value="nuke" disabled>☢️ Nuke (Locked)</option>
            <option value="slime" disabled>🧪 Slime Bomb (Locked)</option>
          </select>
        </label>

        <button id="statsBtn" type="button" class="btn" title="View stats">Stats</button>
        <button id="reset" type="button" class="btn">Reset</button>
        <button id="hintBtn" type="button" class="btn ghost" title="Hint (H)">Hint</button>

        <div class="stats">
          <div><span class="muted">Mines</span> <span id="minesLeft">0</span></div>
          <div><span class="muted">Hints</span> <span id="hintsLeft">5</span></div>
          <div><span class="muted">Time</span> <span id="time">0</span></div>
        </div>
      </div>
    </header>

    <section class="boardWrap">
      <div id="board" class="board" role="grid" aria-label="Minesweeper board"></div>
    </section>

    <footer class="hint">
      Mouse: Left reveal • Right flag • Keyboard: Arrows move • Space/Enter reveal • F flag • H hint
    </footer>

    <canvas id="explosionCanvas" class="explosionCanvas" aria-hidden="true"></canvas>
    <div id="fxLayer" class="fxLayer" aria-hidden="true"></div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>

    <div id="gachaModal" class="modal" aria-hidden="true">
      <div class="modalCard" role="dialog" aria-modal="true" aria-label="Gacha reward">
        <div class="modalTitle">Gacha Machine</div>

        <div class="gachaSlot">
          <div id="gachaSpinner" class="spinner">🎁</div>
        </div>

        <div id="gachaResult" class="gachaResult"></div>

        <div class="modalActions">
          <button id="gachaClaim" class="btn" type="button" disabled>Claim</button>
        </div>
      </div>
    </div>

    <div id="statsModal" class="modal" aria-hidden="true">
      <div class="modalCard statsCard" role="dialog" aria-modal="true" aria-label="Game stats">
        <div class="modalHead">
          <div class="modalTitle">Game Stats</div>
          <button id="statsClose" type="button" class="iconBtn" aria-label="Close stats">X</button>
        </div>

        <div class="statsGrid">
          <div class="statRow"><span>Games Played</span> <strong id="statsPlayed">0</strong></div>
          <div class="statRow"><span>Wins</span> <strong id="statsWins">0</strong></div>
          <div class="statRow"><span>Losses</span> <strong id="statsLosses">0</strong></div>
          <div class="statRow"><span>Win Rate</span> <strong id="statsWinRate">0%</strong></div>
        </div>

        <div class="modalActions">
          <button id="statsReset" class="btn ghost" type="button">Reset Stats</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="script.js?v=20260308b"></script>
</body>
</html>
